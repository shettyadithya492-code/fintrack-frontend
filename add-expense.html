<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense - FinTrack</title>
    <link rel="stylesheet" href="cs/style.css">
</head>
<body>
    <div class="page-shell">
        <div class="expense-card">

            <div class="expense-header">
                <div>
                    <button class="back-btn" onclick="window.location.href='dashboard.html'"> Back</button>
                    <h1>Add Expense</h1>
                    <p class="dashboard-subtitle">Track your spending easily.</p>
                </div>
                <div class="expense-art" aria-hidden="true">
                    <span class="coin coin-red coin-1"></span>
                    <span class="coin coin-pink coin-2"></span>
                    <span class="coin coin-red coin-3"></span>
                    <span class="bill bill-expense bill-1"></span>
                </div>
            </div>

            <form id="expenseForm" class="expense-form" novalidate>

                <div class="field-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" placeholder="Amount" min="1" />
                </div>

                <div class="field-group">
                    <label for="category">Category</label>
                    <select id="category">
                        <option value="">Select Category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Health">Health</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="field-group">
                    <label for="mode">Mode</label>
                    <select id="mode">
                        <option value="">Select Mode</option>
                        <option value="Cash">Cash</option>
                        <option value="Debit Card">Debit Card</option>
                        <option value="Credit Card">Credit Card</option>
                        <option value="UPI">UPI</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="field-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" />
                </div>

                <div class="field-group hidden" id="otherCategoryWrapper">
                    <label for="otherCategory">Custom category</label>
                    <input type="text" id="otherCategory" placeholder="Custom category" />
                </div>

                <div class="field-group">
                    <label for="note">Note</label>
                    <input type="text" id="note" placeholder="Note" />
                </div>

                <button type="button" class="btn-primary" onclick="addExpense()">Add Expense</button>

                <p id="message" class="message"></p>

            </form>
        </div>
    </div>

    <script src="js/expense.js"></script>
</body>
</html>
