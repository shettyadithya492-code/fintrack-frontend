<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Income - FinTrack</title>
    <link rel="stylesheet" href="cs/style.css">
</head>
<body>
    <div class="page-shell">
        <div class="income-card">
            <div class="income-header">
                <div>
                    <button class="back-btn" onclick="window.location.href='dashboard.html'" aria-label="Back to Dashboard"> Back</button>
                    <h1>Add Income</h1>
                    <p class="dashboard-subtitle">Add your income sources quickly and easily.</p>
                </div>
                <div class="income-art" aria-hidden="true">
                    <span class="coin coin-gold coin-1"></span>
                    <span class="coin coin-green coin-2"></span>
                    <span class="coin coin-gold coin-3"></span>
                    <span class="bill bill-1"></span>
                </div>
            </div>

            <form id="incomeForm" class="income-form" novalidate>
                <div class="field-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" placeholder="Amount" min="1" />
                </div>

                <div class="field-group">
                    <label for="category">Category</label>
                    <select id="category">
                        <option value="">Select Category</option>
                        <option value="Salary">Salary</option>
                        <option value="Freelance">Freelance</option>
                        <option value="Business">Business</option>
                        <option value="Investment">Investment</option>
                        <option value="Gift">Gift</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="field-group">
                    <label for="mode">Mode</label>
                    <select id="mode">
                        <option value="">Select Mode</option>
                        <option value="Cash">Cash</option>
                        <option value="Bank">Bank</option>
                        <option value="Others">Others</option>
                    </select>
                </div>

                <div class="field-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" />
                </div>

                <div class="field-group hidden" id="otherCategoryWrapper">
                    <label for="otherCategory">Custom category</label>
                    <input type="text" id="otherCategory" placeholder="Custom category" />
                </div>

                <div class="field-group">
                    <label for="note">Note</label>
                    <input type="text" id="note" placeholder="Note" />
                </div>

                <button type="button" class="btn-primary" onclick="addIncome()">Add Income</button>
                <p id="message" class="message"></p>
            </form>
        </div>
    </div>

    <script src="js/income.js"></script>
</body>
</html>
