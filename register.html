<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - FinTrack</title>

    <link
        rel="stylesheet"
        href="cs/style.css"
    >

</head>

<body>

<div class="page-shell">

    <div class="login-card">

        <div class="login-brand">

            <div class="brand-mark">
                A.R
            </div>

            <div>

                <h1>Create Account</h1>

                <p>
                    Register securely using Email OTP
                </p>

            </div>

        </div>

        <form id="registerForm" novalidate>

            <!-- NAME -->
            <div class="field-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    id="name"
                    type="text"
                    placeholder="Enter your name"
                />

            </div>

            <!-- EMAIL -->
            <div class="field-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Enter your email"
                />

            </div>

            <!-- SEND OTP -->
            <button
                type="button"
                id="sendOtp"
                class="btn-secondary"
            >
                Send OTP
            </button>

            <!-- OTP SECTION -->
            <div
                id="otpSection"
                class="hidden"
            >

                <div class="field-group">

                    <label for="otp">
                        OTP Code
                    </label>

                    <input
                        id="otp"
                        type="text"
                        maxlength="6"
                        placeholder="Enter OTP"
                    />

                </div>

                <button
                    type="button"
                    id="verifyOtp"
                    class="btn-secondary"
                >
                    Verify OTP
                </button>

            </div>

            <!-- PIN SECTION -->
            <div
                id="pinSection"
                class="hidden"
            >

                <div class="field-group">

                    <label for="pin">
                        PIN
                    </label>

                    <input
                        id="pin"
                        type="password"
                        maxlength="4"
                        placeholder="Create 4-digit PIN"
                    />

                </div>

                <div class="field-group">

                    <label for="confirmPin">
                        Confirm PIN
                    </label>

                    <input
                        id="confirmPin"
                        type="password"
                        maxlength="4"
                        placeholder="Repeat PIN"
                    />

                </div>

                <button
                    type="button"
                    id="registerButton"
                    class="btn-primary"
                >
                    Register
                </button>

            </div>

            <p
                id="message"
                class="message"
            ></p>

            <div class="meta-row">

                <a
                    href="index.html"
                    class="meta-link"
                >
                    Already have an account? Login
                </a>

            </div>

        </form>

    </div>

</div>

<script src="js/auth.js"></script>

</body>

</html>
