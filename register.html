<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - FinTrack</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<div class="page-shell">

    <div class="login-card">

        <div class="login-brand">

            <div class="brand-mark">
                A.R
            </div>

            <div>

                <h1>Create Account</h1>

                <p>
                    Register securely with phone number and PIN
                </p>

            </div>

        </div>

        <form
            id="registerForm"
            class="login-form"
            novalidate
        >

            <!-- NAME -->
            <div class="field-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    id="name"
                    type="text"
                    placeholder="Enter your full name"
                />

            </div>

            <!-- PHONE -->
            <div class="field-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    id="phone"
                    type="tel"
                    maxlength="10"
                    placeholder="Enter 10-digit phone number"
                />

            </div>

            <!-- PIN -->
            <div class="field-group">

                <label for="pin">
                    Create PIN
                </label>

                <div class="pin-field">

                    <input
                        id="pin"
                        type="password"
                        maxlength="4"
                        placeholder="Create 4-digit PIN"
                    />

                    <button
                        type="button"
                        id="togglePin"
                        class="toggle-pin"
                    >
                        Show
                    </button>

                </div>

            </div>

            <!-- CONFIRM PIN -->
            <div class="field-group">

                <label for="confirmPin">
                    Confirm PIN
                </label>

                <div class="pin-field">

                    <input
                        id="confirmPin"
                        type="password"
                        maxlength="4"
                        placeholder="Confirm 4-digit PIN"
                    />

                    <button
                        type="button"
                        id="toggleConfirmPin"
                        class="toggle-pin"
                    >
                        Show
                    </button>

                </div>

            </div>

            <!-- REGISTER BUTTON -->
            <button
                type="submit"
                class="btn-primary"
            >
                Create Account
            </button>

            <!-- MESSAGE -->
            <p
                id="message"
                class="message"
            ></p>

            <!-- LOGIN LINK -->
            <div class="meta-row">

                <a
                    href="index.html"
                    class="meta-link"
                >
                    Already have an account? Login
                </a>

            </div>

        </form>

    </div>

</div>

<script src="js/auth.js"></script>

</body>

</html>
